# OpenSearch Search Engine
#
# The dashboard is a separate include — see includes/opensearch-dashboards.yaml (port 5602),
# matching how elasticsearch-dev.yaml / kibana-simple.yaml and the alfresco-* pairs are split.
#
# Alfresco can share this engine instead of running its own: leave both alfresco-*search
# includes out and set ALFRESCO_SEARCH_HOST=opensearch in docker/.env. Alfresco writes its own
# `alfresco` index, so it coexists with this project's indices in one cluster. Version 2.19.6
# matches includes/alfresco-opensearch.yaml and the Alfresco reference deployments.
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.6
    container_name: flexible-graphrag-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - cluster.name=flexible-graphrag-opensearch
      - node.name=opensearch-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    ports:
      - "9201:9200"    # Changed port to avoid conflict with Elasticsearch
      # 9301 (inter-node transport) intentionally NOT exposed: single-node OpenSearch has no
      # peers, and on Windows 9301 falls in a WinNAT-reserved range (9248-9347) so the bind is
      # forbidden ("access permissions"). The app only needs 9201 (HTTP). OpenSearch still
      # binds 9300 internally in the container.
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      # The OpenSearch image does ship curl (unlike Qdrant's), so a plain CMD curl works here.
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  opensearch_data:
