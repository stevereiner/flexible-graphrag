# OpenSearch Dashboards over the Alfresco OpenSearch index — optional, for seeing what
# actually got indexed by batch-indexing.
#
# Requires includes/alfresco-opensearch.yaml. Off by default: this project already runs
# OpenSearch Dashboards on 5602 (includes/opensearch.yaml), and if you share that engine
# (ALFRESCO_SEARCH_HOST=opensearch) it shows the Alfresco index too, making this container
# unnecessary.
#
# For the Elasticsearch equivalent see includes/alfresco-kibana.yaml.
services:
  alfresco-opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.6
    mem_limit: 1g
    environment:
      - 'OPENSEARCH_HOSTS=["http://alfresco-opensearch:9200"]'
      - server.host=0.0.0.0
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5604:5601"   # 5601 = this project's Kibana, 5602 = its OpenSearch Dashboards,
                      # 5603 = the Alfresco Kibana alternative
    depends_on:
      alfresco-opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-o", "/dev/null", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 30s
