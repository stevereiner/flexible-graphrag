# Flexible GraphRAG - Main Docker Compose
#
# The primary compose file for the whole stack, used two ways:
#   - databases in Docker while the backend and UIs run from source (development), or
#   - everything in Docker, app included, by enabling app-stack.yaml + proxy.yaml below.
# Pick your services by commenting include lines in or out.

# IMPORTANT: Before starting, ensure Docker has adequate memory allocated.
# The full stack requires 16GB+ in the Docker VM; with vLLM add ~8GB on top of model VRAM needs.
# See docs/DOCKER-RESOURCE-CONFIGURATION.md for platform-specific setup:
#   Windows:              create C:\Users\<you>\.wslconfig with memory= (see doc for sizing guide)
#   macOS:                Docker Desktop -> Settings -> Resources -> Memory
#   Linux Docker Desktop: Docker Desktop -> Settings -> Resources -> Memory
#   Linux Docker Engine:  native, no VM limits - see doc for cgroup, swap, vm.max_map_count, NVIDIA toolkit

# ENVIRONMENT FILES - both git-ignored, both created during setup:
#   flexible-graphrag/.env   the app's own configuration (LLM keys, DB configs, feature flags)
#   docker/.env              Docker address overrides, AND the file Compose reads for the ${...}
#                            placeholders in the includes below (ALFRESCO_SEARCH_HOST, VLLM_MODEL,
#                            FLEXIBLE_GRAPHRAG_VERSION). Compose auto-loads any `.env` sitting next
#                            to this file, which is why the includes need no extra syntax.
#                            Copy it from docker-env-sample.txt.
# Precedence, the full variable list, and why flexible-graphrag/.env is NOT consulted for ${...}:
#   docker/DOCKER-ENV-SETUP.md
# Edits apply on `docker compose up --force-recreate`; a running container keeps its values.

# Docker Compose v2 doesn't require version field

# Include or comment out (if have externally or don't need) services
